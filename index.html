<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Tongue Jump Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #a3d9ff; /* Sky color */
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(to bottom, #a3d9ff 0%, #e0f7fa 100%);
        }
        
        /* The Pillow/Lilypad */
        #pillow {
            width: 150px;
            height: 50px;
            background-color: #4CAF50;
            border-radius: 50px;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 0 #2e7d32;
        }

        /* The Frog */
        #frog {
            width: 60px;
            height: 50px;
            background-color: #66bb6a;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            transition: bottom 0.5s ease-out;
            z-index: 10;
        }
        
        /* Frog Eyes */
        #frog::before, #frog::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: -10px;
        }
        #frog::before { left: 5px; }
        #frog::after { right: 5px; }
        
        /* Frog Pupils */
        #frog-pupil::before, #frog-pupil::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: black;
            border-radius: 50%;
            top: -5px;
            z-index: 11;
        }
        #frog-pupil::before { left: 10px; }
        #frog-pupil::after { right: 10px; }

        /* The Tongue (hidden by default) */
        #tongue {
            width: 10px;
            height: 0px;
            background-color: #ff5252;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
            transition: height 0.2s ease-in-out;
            z-index: 5;
        }

        /* Tongue extension class */
        .jump #tongue {
            height: 60px;
            top: -40px; /* Extends from mouth */
        }

        /* Score Display */
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score">Height: 0</div>
    <div id="pillow"></div>
    <div id="frog">
        <div id="frog-pupil"></div>
        <div id="tongue"></div>
    </div>
</div>

<script>
    const frog = document.getElementById('frog');
    const scoreDisplay = document.getElementById('score');
    let isJumping = false;
    let score = 0;

    function jump() {
        if (isJumping) return;
        isJumping = true;
        
        // Add tongue class
        frog.classList.add('jump');
        
        // Move frog up
        frog.style.bottom = '400px'; 
        
        // Update Score
        score++;
        scoreDisplay.innerText = "Height: " + score;

        // Bring frog down & hide tongue
        setTimeout(() => {
            frog.style.bottom = '100px';
            frog.classList.remove('jump');
            isJumping = false;
        }, 500);
    }

    // Controls
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') jump();
    });
    document.addEventListener('click', jump);
</script>

</body>
</html>
